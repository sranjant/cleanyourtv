name: Build CleanYourTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CleanYourTV
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify APK size
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK"
          test "$(stat -c %s "$APK")" -lt 589824

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-acer-r3
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
